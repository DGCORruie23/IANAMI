<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2C2C2A">
    <title>Iniciar Sesión · IA-NAMI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo: #B66666;
            --arena: #BDB58D;
            --verde: #778E88;
            --crema: #E5E2D3;
            --gris: #808080;
            --blanco: #FAFAF8;
            --gris-oscuro: #4A4A48;
            --texto: #2C2C2A;
            --fondo: #F2F0E8;
            --fondo-card: #FAFAF8;
            --borde: #D6D2C0;
            --sombra: rgba(44, 44, 42, 0.08);
            --sombra-med: rgba(44, 44, 42, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--fondo-card);
            border: 1px solid var(--borde);
            border-radius: 8px;
            box-shadow: 0 10px 30px var(--sombra-med);
            overflow: hidden;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--rojo), var(--arena), var(--verde));
        }

        .login-header {
            background: var(--texto);
            padding: 28px 24px;
            text-align: center;
            border-bottom: 2px solid var(--rojo);
        }

        .login-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--crema);
            line-height: 1;
            margin-bottom: 6px;
        }

        .login-logo span {
            color: var(--rojo);
        }

        .login-sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--arena);
            text-transform: uppercase;
        }

        .login-body {
            padding: 32px 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gris-oscuro);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 14px;
            border: 1px solid var(--borde);
            border-radius: 4px;
            background: var(--fondo);
            color: var(--texto);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--verde);
            background: var(--blanco);
            box-shadow: 0 0 0 3px rgba(119, 142, 136, 0.15);
        }

        .btn-submit {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: var(--rojo);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(182, 102, 102, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(182, 102, 102, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(182, 102, 102, 0.1);
            border: 1px solid var(--rojo);
            border-left: 4px solid var(--rojo);
            color: var(--rojo);
            border-radius: 4px;
            padding: 12px;
            font-size: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--rojo);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <div class="login-logo">Ecosistema de Inteligencia Migratoria <span>·</span> IA-NAMI</div>
        <div class="login-sub">Acceso Restringido · V3.0</div>
    </div>

    <div class="login-body">
        {% if form.errors %}
        <div class="error-msg">
            <div class="error-dot"></div>
            <span>Usuario o contraseña incorrectos. Por favor, inténtelo de nuevo.</span>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username" class="form-label">Usuario</label>
                <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Ingrese su usuario">
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" required id="id_password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>
    </div>
</div>

</body>
</html>
